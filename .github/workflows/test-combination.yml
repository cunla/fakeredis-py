---
name: Test one combination

run-name: >
  tests ${{ inputs.server-image }},
  py${{ inputs.python-version }},redis-py:${{ inputs.redis-py }}

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        type: choice
        required: true
        default: "3.14"
        options:
          - "3.10"
          - "3.12"
          - "3.13"
          - "3.14"
      redis-py:
        description: "redis-py version"
        type: choice
        required: true
        default: "8.1.0"
        options:
          - "4.6.0"
          - "5.3.1"
          - "6.4.0"
          - "7.4.0"
          - "8.1.0"
      server-image:
        description: "Server to test against"
        type: choice
        required: true
        default: "redis:8.8"
        options:
          - "redis:8.8"
          - "redis:7.4.8"
          - "redis:6.2.17"
          - "valkey/valkey:9.1"
          - "valkey/valkey:8.1.8"
          - "redis/redis-stack-server:7.4.0-v8"
          - "redis/redis-stack-server:6.2.6-v20"
          - "docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      server:
        image: ${{ inputs.server-image }}
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          cache-dependency-path: uv.lock
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          uv sync --all-extras
          uv pip install redis==${{ inputs.redis-py }}
      - name: Run tests
        timeout-minutes: 15
        run: |
          uv run --no-sync pytest -v -m "not slow and not tcp_server" \
            --html=report.html --self-contained-html
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-py${{ inputs.python-version }}-redis-py${{ inputs.redis-py }}
          path: report.html
